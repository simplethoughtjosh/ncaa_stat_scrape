[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "college-sports-scraper"
version = "0.1.0"
description = "NCAA stats scraper with NewBlue Captivate basketball graphics control"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pandas>=2.0",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "curl_cffi>=0.7",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Sibling repo: pip install -e "../player-photos"  (or: pip install -e ".[photos]")
photos = ["roster-headshots @ file:../player-photos"]

[project.scripts]
college-sports = "college_sports_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
